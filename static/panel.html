<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV remote</title><meta name="theme-color" content="#176750"><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="icon" href="{{ICON192}}"><link rel="apple-touch-icon" href="{{ICON192}}"><link rel="stylesheet" href="{{CSS}}"></head><body><header><b>TV remote</b><span>Signed in as {{USER}}</span></header><main><nav aria-label="Devices"><h2>Your devices</h2><div id="device-choices">{{CHOICES}}</div></nav><div id="screens">{{BODY}}</div></main><div id="snackbar" role="status" aria-live="polite" hidden><p></p><button aria-label="Dismiss message">Close</button></div><dialog id="power-confirm" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">Power off?</h2><p></p><div class="row"><button value="cancel" autofocus>Keep watching</button><button value="off">Power off</button></div></form></dialog><dialog id="screen-dialog" aria-label="Current TV screen"><button class="screen-close">Close</button><p class="screen-note"></p><img alt="Full-size current TV screen"></dialog><script src="{{JS}}" defer></script></body></html>
