# tv-control device inventory (example). Mount the real file read-only and point DEVICES_FILE at it.
# ip is the primary ADB/webOS address; tailnet_fqdn is tried when ip fails.
# status: pending marks a device with no reachable address yet; health and the panel skip it.
# capabilities gates verbs: find_remote, wake, power, inputs, sleep_timer.
# tv_control: best-effort marks a device whose TV has no confirmed HDMI-CEC.
# paired_tv names the TV a Shield feeds; health reports it as standby unless the Shield plays.
# Inputs are read from the TV (list_inputs). Every input key below is optional and only adds names:
# inputs: input key -> button label. A key the TV does not list is shown with an error and refused.
# input_ids (Fire TV only): input key -> Android TvInputInfo id, pinning which listed input a key means.
# input_keys (Fire TV only): input key -> Android keyevent name, used instead of the passthrough intent
#   for TVs whose passthrough intent opens the wrong screen. Neither wakes the TV.
# input_aliases: spoken name -> input id or another name ("cable box": HDMI_2).
# tailnet_ip: a second address tried after ip and before tailnet_fqdn.
# household: groups TVs for the message policy (messages.narration.households, assistant replies).
# narration: every_step | start_end | off; overrides the household's narration depth for one device.
devices:
  - name: living-room-shield
    label: Living Room Shield
    site: home
    ip: 192.0.2.20
    tailnet_fqdn: living-room-shield.example.ts.net
    port: 5555
    tailnet_ip: 203.0.113.20
    type: shield
    household: family
    paired_tv: living-room-tv
    capabilities: [find_remote, power, sleep_timer]
    # allowed_apps: optional. When present, automation opens only these ids here (deny by default).
    allowed_apps:
      - com.plexapp.android
      - org.smarttube.stable
  - name: living-room-tv
    site: home
    ip: 192.0.2.21
    type: webos
    household: family
    mac: "00:00:5e:00:53:01"
    capabilities: [wake, power, inputs, sleep_timer]
    inputs:
      HDMI_1: Shield
      HDMI_2: Console
    input_aliases:
      game box: HDMI_2
  - name: cabin-firetv
    site: cabin
    ip: 198.51.100.40
    port: 5555
    type: firestick
    household: grandparents
    narration: start_end
    tv_control: best-effort
    capabilities: [sleep_timer]
  - name: cabin-tv
    label: Cabin TV
    site: cabin
    ip: 198.51.100.41
    port: 5555
    type: firetv
    household: grandparents
    capabilities: [inputs, sleep_timer]
    inputs:
      hdmi1: Shield
      hdmi2: Console
    input_keys:
      hdmi2: TV_INPUT_HDMI_2
    input_ids:
      hdmi1: com.example.tvinput/.HdmiInputService/HW2
  - name: guest-room-shield
    site: cabin
    status: pending
    type: shield
    capabilities: [find_remote]

# Substrings matched against package ids and app labels; tv-control refuses to launch a match
# and the panel hides it. netflix is only an example entry.
denied_apps:
  - netflix

# app_aliases: optional spoken name -> package or webOS id (or a list; the first installed id wins).
# A device may carry its own app_aliases, which override these.
app_aliases:
  youtube tv: [com.google.android.youtube.tvunplugged, youtube.leanback.ytv.v1]

# Quick-launch buttons on each card. id: package or webOS app ids; title: fallback title match.
quick_apps:
  - label: Plex
    id: [com.plexapp.android]
    title: [plex]
  - label: SmartTube
    id: [org.smarttube.stable]

# type_profiles: per-type baseline for the optional SCRIPTS_DIR scripts (tv-control itself ignores it).
# debloat_lists: named package lists; cec_on: Settings.Global keys set to 1; keep_apps: never disabled.
type_profiles:
  shield:
    cec_on: [hdmi_control_auto_wakeup_enabled, hdmi_control_auto_device_off_enabled]
    keep_apps: [com.plexapp.android]
  firetv:
    cec_on: [hdmi_control_auto_wakeup_enabled, hdmi_control_auto_device_off_enabled]
    keep_apps: [com.plexapp.android]

# messages: the on-screen message policy (messages.py). Required for toast, narrate, and narrated verbs.
# title: shown on every message. corner: TvOverlay corner (top_start, top_end, bottom_start, bottom_end).
# duration: ceil(words * seconds_per_5_words / 5) seconds, clamped to floor_s..cap_s.
# quiet_hours: device-local HH:MM; an unrequested message inside the window is dropped.
# unrequested_kinds: the only notices a sender may push without a request (media_ready, reply_waiting,
#   operator_push).
# narration: every_step | start_end | off, by device (its narration: key), then household, then default.
# assistant: name is shown in the narration intro ("Hi, this is <name>."); sender is the id the assistant
#   passes as sender= to toast. Defaults: name "your TV assistant", sender "assistant".
messages:
  title: TV Helper
  corner: top_end
  duration:
    seconds_per_5_words: 2
    floor_s: 6
    cap_s: 20
  quiet_hours:
    start: "22:00"
    end: "07:00"
  unrequested_kinds: [media_ready, reply_waiting, operator_push]
  narration:
    default: start_end
    households:
      grandparents: every_step
  assistant:
    name: TV Helper
    sender: assistant

# cidr: private LAN that scan_site probes (ADB 5555, webOS 3000/3001); empty means no routed LAN.
# wol_relay: user@host on that LAN that sends Wake-on-LAN for the site's webOS TVs over SSH.
sites:
  home:
    cidr: 192.0.2.0/24
    wol_relay: user@relay.example.com
  cabin:
    cidr: 198.51.100.0/24
